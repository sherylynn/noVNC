<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill:#172033; }
      .title { font-size:40px; font-weight:700; }
      .subtitle { font-size:22px; fill:#46536b; }
      .h2 { font-size:26px; font-weight:700; }
      .h3 { font-size:21px; font-weight:700; }
      .body { font-size:18px; }
      .small { font-size:16px; fill:#46536b; }
      .box { stroke-width:2; rx:18; ry:18; }
      .arrow { stroke-width:5; fill:none; marker-end:url(#arrow); }
      .dash { stroke-dasharray:10 8; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect width="1500" height="1050" fill="#f7f9fc"/>
  <text x="750" y="58" text-anchor="middle" class="title">三端剪贴板共享与意图仲裁</text>
  <text x="750" y="92" text-anchor="middle" class="subtitle">PC / Mac ⇄ noVNC ⇄ Linux(chroot) ⇄ Android / NewHome</text>

  <rect x="40" y="135" width="390" height="315" class="box" fill="#eaf3ff" stroke="#4089e8"/>
  <text x="70" y="180" class="h2">PC / Mac（控制端）</text>
  <rect x="75" y="205" width="320" height="92" rx="14" fill="#fff" stroke="#8bb7ef"/>
  <text x="95" y="240" class="h3">Controller Clipboard Slot</text>
  <text x="95" y="272" class="body">内容 + hash + observed_at + source</text>
  <text x="70" y="335" class="body">• 浏览器 paste event：最可信</text>
  <text x="70" y="368" class="body">• HTTPS + 已授权时可安全 readText()</text>
  <text x="70" y="401" class="body">• 鼠标进入只刷新候选，不立刻覆盖 Linux</text>

  <rect x="555" y="135" width="390" height="315" class="box" fill="#f2ecff" stroke="#8a5bd8"/>
  <text x="585" y="180" class="h2">noVNC（剪贴板仲裁器）</text>
  <text x="585" y="225" class="body">• 同时维护 controller / remote 两个 slot</text>
  <text x="585" y="260" class="body">• 鼠标重新进入：开启 5 秒 PC 优先窗口</text>
  <text x="585" y="295" class="body">• 进入本身不写 X11，不污染远端剪贴板</text>
  <text x="585" y="330" class="body">• 真正 Paste / 右键时才按意图 staging</text>
  <text x="585" y="365" class="body">• 识别 PC 注入后的 RFB echo，避免回环</text>
  <text x="585" y="400" class="body">• Linux 新 Copy 自动尝试写回 PC</text>

  <rect x="1070" y="135" width="390" height="315" class="box" fill="#eaf8ef" stroke="#46a868"/>
  <text x="1100" y="180" class="h2">受控端剪贴板域</text>
  <rect x="1100" y="210" width="145" height="90" rx="14" fill="#fff" stroke="#79c894"/>
  <text x="1172" y="246" text-anchor="middle" class="h3">Android</text>
  <text x="1172" y="276" text-anchor="middle" class="small">NewHome</text>
  <rect x="1280" y="210" width="145" height="90" rx="14" fill="#fff" stroke="#79c894"/>
  <text x="1352" y="246" text-anchor="middle" class="h3">Linux</text>
  <text x="1352" y="276" text-anchor="middle" class="small">X11 CLIPBOARD</text>
  <path d="M1248 255 L1275 255" class="arrow" stroke="#46a868"/>
  <path d="M1277 270 L1250 270" class="arrow" stroke="#46a868"/>
  <text x="1100" y="342" class="body">• Android Copy → NewHome bridge → X11</text>
  <text x="1100" y="377" class="body">• Linux Copy → X11 → NewHome / Android</text>
  <text x="1100" y="412" class="body">• noVNC 侧把二者视为一个 remote slot</text>

  <path d="M430 260 L550 260" class="arrow" stroke="#4089e8"/>
  <text x="490" y="240" text-anchor="middle" class="small">PC → Linux</text>
  <path d="M555 320 L435 320" class="arrow" stroke="#46a868"/>
  <text x="495" y="350" text-anchor="middle" class="small">Linux → PC</text>
  <path d="M945 285 L1065 285" class="arrow" stroke="#8a5bd8"/>
  <text x="1005" y="265" text-anchor="middle" class="small">RFB clipboard</text>

  <rect x="40" y="500" width="1420" height="205" class="box" fill="#fff" stroke="#c7d0df"/>
  <text x="70" y="542" class="h2">核心判断：先看“鼠标上下文”，再看“真正的粘贴动作”</text>

  <circle cx="100" cy="605" r="28" fill="#4089e8"/><text x="100" y="613" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text>
  <text x="145" y="590" class="h3">鼠标刚从 PC/Mac 进入 noVNC（≤ 5 秒）</text>
  <text x="145" y="625" class="body">用户大概率刚在 PC/Mac Copy，下一次 Paste 应优先使用 controller slot。</text>
  <text x="145" y="658" class="small">但“进入”本身不写 Linux，只有 Cmd/Ctrl+V 或右键才 stage。</text>

  <circle cx="790" cy="605" r="28" fill="#46a868"/><text x="790" y="613" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text>
  <text x="835" y="590" class="h3">鼠标已持续停留在 noVNC</text>
  <text x="835" y="625" class="body">视为用户正在 Linux/Android 内连续操作，remote clipboard 保持权威。</text>
  <text x="835" y="658" class="small">PC 缓存不会因为“更旧/更新”而盲目覆盖 X11。</text>

  <text x="40" y="760" class="h2">典型场景</text>

  <rect x="40" y="790" width="330" height="220" class="box" fill="#eaf3ff" stroke="#4089e8"/>
  <text x="65" y="830" class="h3">A. PC → Linux（刚进入）</text>
  <text x="65" y="870" class="body">PC Copy A</text>
  <text x="65" y="902" class="body">↓ 鼠标进入 noVNC</text>
  <text x="65" y="934" class="body">↓ Cmd/Ctrl+V 或右键</text>
  <text x="65" y="966" class="body">A 先 stage 到 X11，再 Paste</text>

  <rect x="405" y="790" width="330" height="220" class="box" fill="#eaf8ef" stroke="#46a868"/>
  <text x="430" y="830" class="h3">B. Linux → PC</text>
  <text x="430" y="870" class="body">Linux Ctrl+C → X11 = B</text>
  <text x="430" y="902" class="body">↓ RFB Server Clipboard</text>
  <text x="430" y="934" class="body">↓ noVNC remote slot = B</text>
  <text x="430" y="966" class="body">↓ 自动写 PC；失败则待用户激活</text>

  <rect x="770" y="790" width="330" height="220" class="box" fill="#fff4df" stroke="#d89a2b"/>
  <text x="795" y="830" class="h3">C. Android → Linux</text>
  <text x="795" y="870" class="body">Android Copy C</text>
  <text x="795" y="902" class="body">↓ NewHome ClipboardManager</text>
  <text x="795" y="934" class="body">↓ localhost:4715 bridge</text>
  <text x="795" y="966" class="body">↓ X11 = C，可在 Linux 直接粘贴</text>

  <rect x="1135" y="790" width="325" height="220" class="box" fill="#f2ecff" stroke="#8a5bd8"/>
  <text x="1160" y="830" class="h3">D. 已在 Linux 内操作</text>
  <text x="1160" y="870" class="body">Linux / Android 当前 = D</text>
  <text x="1160" y="902" class="body">↓ 已超过入口优先窗口</text>
  <text x="1160" y="934" class="body">↓ Ctrl+V / 右键粘贴</text>
  <text x="1160" y="966" class="body">继续使用 D，不注入旧 PC 缓存</text>

  <text x="750" y="1034" text-anchor="middle" class="small">原则：不盲目按时间覆盖；复制产生新 remote 状态，粘贴动作决定是否将 controller slot 注入受控端。</text>
</svg>
